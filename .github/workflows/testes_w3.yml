name: Validacao de Governanca e Codigo

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validacao:
    runs-on: ubuntu-latest
    steps:
      - name: Clonar repositorio completo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Verificar uso de multiplas branches
        shell: bash
        run: |
          total_branches="$(git ls-remote --heads origin | wc -l | tr -d ' ')"
          if [ "$total_branches" -le 1 ]; then
            echo "Reprovado: nenhuma branch de trabalho foi encontrada."
            exit 1
          fi
          echo "Branches de trabalho identificadas no repositorio."

      - name: Verificar sintaxe Python
        run: python -m compileall -q src tests

      - name: Executar testes automatizados
        run: python -m unittest discover -s tests -v

      - name: Executar auditoria de rastreabilidade
        run: >-
          python src/rastreabilidade_si.py
          --desde 1970-01-01
          --ate 2100-12-31
          --json
